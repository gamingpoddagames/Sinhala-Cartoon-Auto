name: Sinhala Cartoon Factory

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: cartoon-generation
  cancel-in-progress: false

jobs:

  generate:

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            python3 \
            python3-pip \
            wget \
            xz-utils \
            libx11-6 \
            libxi6 \
            libxxf86vm1 \
            libxfixes3 \
            libxrender1 \
            libgl1 \
            libsm6 \
            libice6

      - name: Install Blender
        run: |
          wget -q \
            https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz \
            -O blender.tar.xz

          tar -xf blender.tar.xz

          sudo mv \
            blender-5.0.1-linux-x64 \
            /opt/blender

          /opt/blender/blender \
            --version

      - name: Install Python packages
        run: |
          python3 -m pip install \
            --user \
            -r requirements.txt

      - name: Generate episode
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python3 src/generate_episode.py

      - name: Find generated video
        run: |
          find output \
            -type f \
            -name "*.mp4" \
            -print

      - name: Upload cartoon
        uses: actions/upload-artifact@v4
        with:
          name: sinhala-cartoon-${{ github.run_number }}
          path: output/**/*.mp4
          retention-days: 7

      - name: Upload story
        uses: actions/upload-artifact@v4
        with:
          name: story-${{ github.run_number }}
          path: output/**/story.json
          retention-days: 7
