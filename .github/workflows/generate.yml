name: Sinhala Cartoon Factory

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: sinhala-cartoon-generation
  cancel-in-progress: false

jobs:

  generate:

    name: Generate Cartoon Episode

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      LIBGL_ALWAYS_SOFTWARE: "1"
      BLENDER_GPU_BACKEND: "OPENGL"

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true


      # ==========================================================
      # 2. INSTALL SYSTEM PACKAGES
      # ==========================================================

      - name: Install system packages
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            python3 \
            python3-pip \
            wget \
            xz-utils \
            file \
            git-lfs \
            libx11-6 \
            libxi6 \
            libxxf86vm1 \
            libxfixes3 \
            libxrender1 \
            libgl1 \
            libegl1 \
            libgbm1 \
            libsm6 \
            libice6 \
            libfontconfig1 \
            libglib2.0-0


      # ==========================================================
      # 3. CHECK EGL / OPENGL
      # ==========================================================

      - name: Check graphics libraries
        run: |

          echo "=========================================="
          echo "GRAPHICS LIBRARY CHECK"
          echo "=========================================="

          echo ""
          echo "EGL:"

          ldconfig -p | grep libEGL || true

          echo ""
          echo "OpenGL:"

          ldconfig -p | grep libGL.so || true

          echo ""
          echo "GBM:"

          ldconfig -p | grep libgbm || true


      # ==========================================================
      # 4. INSTALL BLENDER 5.0.1
      # ==========================================================

      - name: Install Blender 5.0.1
        run: |

          echo "=========================================="
          echo "INSTALLING BLENDER 5.0.1"
          echo "=========================================="

          wget -q \
            https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz \
            -O blender.tar.xz

          tar -xf blender.tar.xz

          sudo rm -rf /opt/blender

          sudo mv \
            blender-5.0.1-linux-x64 \
            /opt/blender

          echo ""
          echo "Blender version:"

          /opt/blender/blender --version


      # ==========================================================
      # 5. INSTALL PYTHON
      # ==========================================================

      - name: Install Python packages
        run: |

          python3 -m pip install --upgrade pip

          if [ -f requirements.txt ]; then

            python3 -m pip install \
              -r requirements.txt

          else

            echo "requirements.txt not found."
            echo "Continuing..."

          fi


      # ==========================================================
      # 6. SHOW PROJECT
      # ==========================================================

      - name: Show project structure
        run: |

          echo "=========================================="
          echo "PROJECT STRUCTURE"
          echo "=========================================="

          pwd

          echo ""

          find . \
            -maxdepth 3 \
            -type f \
            -not -path "./.git/*" \
            | sort


      # ==========================================================
      # 7. VERIFY BLENDER FILE
      # ==========================================================

      - name: Verify Blender character
        run: |

          echo "=========================================="
          echo "CHECKING CHARACTER"
          echo "=========================================="

          if [ ! -d characters ]; then

            echo "ERROR:"
            echo "characters directory does not exist."

            exit 1

          fi

          if [ ! -f characters/cartoon_character_v2.blend ]; then

            echo "ERROR:"
            echo "cartoon_character_v2.blend does not exist."

            echo ""
            echo "Expected:"
            echo "characters/cartoon_character_v2.blend"

            exit 1

          fi

          echo ""
          echo "Character files:"

          ls -lh characters/

          echo ""
          echo "File information:"

          file \
            characters/cartoon_character_v2.blend

          echo ""
          echo "File size:"

          du -h \
            characters/cartoon_character_v2.blend

          echo ""
          echo "Git LFS:"

          git lfs ls-files || true


      # ==========================================================
      # 8. TEST BLENDER
      # ==========================================================

      - name: Test Blender
        run: |

          echo "=========================================="
          echo "TESTING BLENDER"
          echo "=========================================="

          export LIBGL_ALWAYS_SOFTWARE=1
          export BLENDER_GPU_BACKEND=OPENGL

          /opt/blender/blender \
            --background \
            --version


      # ==========================================================
      # 9. TEST CHARACTER FILE
      # ==========================================================

      - name: Test character file
        run: |

          echo "=========================================="
          echo "OPENING CHARACTER FILE"
          echo "=========================================="

          export LIBGL_ALWAYS_SOFTWARE=1
          export BLENDER_GPU_BACKEND=OPENGL

          /opt/blender/blender \
            --background \
            characters/cartoon_character_v2.blend \
            --python-expr "print('BLENDER FILE OPENED SUCCESSFULLY')"


      # ==========================================================
      # 10. GENERATE EPISODE
      # ==========================================================

      - name: Generate episode
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          LIBGL_ALWAYS_SOFTWARE: "1"
          BLENDER_GPU_BACKEND: "OPENGL"
        run: |

          echo "=========================================="
          echo "STARTING CARTOON FACTORY"
          echo "=========================================="

          python3 src/generate_episode.py


      # ==========================================================
      # 11. SHOW OUTPUT
      # ==========================================================

      - name: Show generated output
        if: always()
        run: |

          echo "=========================================="
          echo "GENERATED FILES"
          echo "=========================================="

          if [ -d output ]; then

            find output \
              -type f \
              -print

          else

            echo "No output directory."

          fi


      # ==========================================================
      # 12. UPLOAD VIDEO
      # ==========================================================

      - name: Upload cartoon video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sinhala-cartoon-episode-${{ github.run_number }}
          path: output/**/*.mp4
          if-no-files-found: error
          retention-days: 7


      # ==========================================================
      # 13. UPLOAD STORY
      # ==========================================================

      - name: Upload story
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sinhala-cartoon-story-${{ github.run_number }}
          path: output/**/story.json
          if-no-files-found: error
          retention-days: 7


      # ==========================================================
      # 14. DEBUG OUTPUT IF FAILED
      # ==========================================================

      - name: Upload debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-debug-${{ github.run_number }}
          path: output/**
          if-no-files-found: ignore
          retention-days: 3
