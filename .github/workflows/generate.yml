name: Sinhala Cartoon Factory

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: sinhala-cartoon-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Cartoon Episode

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      LIBGL_ALWAYS_SOFTWARE: "1"
      BLENDER_GPU_BACKEND: "OPENGL"

    steps:

      # ==========================================================
      # STEP 1 - DOWNLOAD REPOSITORY
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true


      # ==========================================================
      # STEP 2 - INSTALL LINUX PACKAGES
      # ==========================================================

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            python3 \
            python3-pip \
            wget \
            xz-utils \
            file \
            git-lfs \
            libx11-6 \
            libxi6 \
            libxxf86vm1 \
            libxfixes3 \
            libxrender1 \
            libgl1 \
            libegl1 \
            libegl1-mesa \
            libgl1-mesa-dri \
            libgbm1 \
            libsm6 \
            libice6 \
            libfontconfig1 \
            libglib2.0-0


      # ==========================================================
      # STEP 3 - CHECK REQUIRED GRAPHICS LIBRARIES
      # ==========================================================

      - name: Check graphics libraries
        run: |
          echo "Checking EGL library..."

          ldconfig -p | grep libEGL || true

          echo ""
          echo "Checking OpenGL library..."

          ldconfig -p | grep libGL.so || true


      # ==========================================================
      # STEP 4 - INSTALL BLENDER 5.0.1
      # ==========================================================

      - name: Install Blender 5.0.1
        run: |
          echo "Downloading Blender..."

          wget -q \
            https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz \
            -O blender.tar.xz

          echo "Extracting Blender..."

          tar -xf blender.tar.xz

          echo "Moving Blender..."

          sudo rm -rf /opt/blender

          sudo mv \
            blender-5.0.1-linux-x64 \
            /opt/blender

          echo ""
          echo "Blender installed:"
          /opt/blender/blender --version


      # ==========================================================
      # STEP 5 - INSTALL PYTHON PACKAGES
      # ==========================================================

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          else
            echo "No requirements.txt found."
          fi


      # ==========================================================
      # STEP 6 - CHECK PROJECT FILES
      # ==========================================================

      - name: Show project structure
        run: |
          echo "Repository:"
          pwd

          echo ""
          echo "Files:"
          find . \
            -maxdepth 3 \
            -type f \
            -not -path "./.git/*" \
            | sort


      # ==========================================================
      # STEP 7 - VERIFY CHARACTER FILE
      # ==========================================================

      - name: Verify Blender character file
        run: |
          echo "=========================================="
          echo "CHECKING CHARACTER FILE"
          echo "=========================================="

          if [ ! -d characters ]; then
            echo "ERROR: characters directory does not exist."
            exit 1
          fi

          if [ ! -f characters/cartoon_character_v2.blend ]; then
            echo "ERROR: Blender character file does not exist."
            echo ""
            echo "Expected:"
            echo "characters/cartoon_character_v2.blend"
            exit 1
          fi

          echo ""
          echo "Character directory:"
          ls -lh characters/

          echo ""
          echo "Character file information:"
          file characters/cartoon_character_v2.blend

          echo ""
          echo "Character file size:"
          du -h characters/cartoon_character_v2.blend

          echo ""
          echo "Git LFS files:"
          git lfs ls-files || true


      # ==========================================================
      # STEP 8 - TEST OPENING BLEND FILE
      # ==========================================================

      - name: Test Blender character
        run: |
          echo "=========================================="
          echo "TESTING BLENDER FILE"
          echo "=========================================="

          export LIBGL_ALWAYS_SOFTWARE=1
          export BLENDER_GPU_BACKEND=OPENGL

          /opt/blender/blender \
            --background \
            characters/cartoon_character_v2.blend \
            --python-expr "print('BLENDER FILE OPENED SUCCESSFULLY')"

          echo ""
          echo "Character file test finished."


      # ==========================================================
      # STEP 9 - TEST BLENDER HEADLESS MODE
      # ==========================================================

      - name: Test Blender headless mode
        run: |
          echo "=========================================="
          echo "TESTING BLENDER HEADLESS MODE"
          echo "=========================================="

          export LIBGL_ALWAYS_SOFTWARE=1
          export BLENDER_GPU_BACKEND=OPENGL

          /opt/blender/blender \
            --background \
            --version

          echo ""
          echo "Blender headless test successful."


      # ==========================================================
      # STEP 10 - GENERATE CARTOON EPISODE
      # ==========================================================

      - name: Generate episode
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          LIBGL_ALWAYS_SOFTWARE: "1"
          BLENDER_GPU_BACKEND: "OPENGL"
        run: |
          echo "=========================================="
          echo "GENERATING SINHALA CARTOON"
          echo "=========================================="

          python3 src/generate_episode.py


      # ==========================================================
      # STEP 11 - SHOW ALL OUTPUT
      # ==========================================================

      - name: Show generated output
        if: always()
        run: |
          echo "=========================================="
          echo "GENERATED OUTPUT"
          echo "=========================================="

          if [ -d output ]; then
            find output \
              -type f \
              -printf "%p - %k KB\n" \
              | sort
          else
            echo "Output directory was not created."
          fi


      # ==========================================================
      # STEP 12 - UPLOAD DEBUG OUTPUT IF GENERATION FAILS
      # ==========================================================

      - name: Upload debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-debug-${{ github.run_number }}
          path: |
            output/**
          if-no-files-found: ignore
          retention-days: 7


      # ==========================================================
      # STEP 13 - UPLOAD CARTOON VIDEO
      # ==========================================================

      - name: Upload cartoon MP4
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sinhala-cartoon-episode-${{ github.run_number }}
          path: |
            output/**/*.mp4
          if-no-files-found: error
          retention-days: 7


      # ==========================================================
      # STEP 14 - UPLOAD STORY FILE
      # ==========================================================

      - name: Upload story
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sinhala-cartoon-story-${{ github.run_number }}
          path: |
            output/**/story.json
          if-no-files-found: error
          retention-days: 7
