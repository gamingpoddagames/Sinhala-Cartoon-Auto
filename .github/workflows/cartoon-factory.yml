name: Sinhala Cartoon Factory
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: python factory.py --mode 2d --width 640 --height 360 --fps 12
      - uses: actions/upload-artifact@v4
        with:
          name: sinhala-cartoon-2d
          path: |
            output/*.mp4
            output/*.srt
          retention-days: 7
